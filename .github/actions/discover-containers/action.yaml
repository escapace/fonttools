name: discover containers

description: discover container build targets in a monorepo

inputs:
  dockerfile-name:
    default: Dockerfile
    description: Dockerfile file name required inside each candidate package directory
    required: false
  image-name-prefix-prepend:
    default: ''
    description: Prefix to prepend to each discovered container name after stripping
    required: false
  image-name-prefix-strip:
    default: ''
    description: Strip this prefix from the derived container name before prepending
    required: false
  required-package-name-prefix:
    default: ''
    description: Require package.json name to start with this prefix
    required: false
  required-script-name:
    default: ''
    description: Require package.json scripts[required-script-name] to be a string
    required: false
  required-target:
    default: ''
    description: Require the Dockerfile to define this named target stage
    required: false

outputs:
  containers:
    description: JSON array of discovered container targets
    value: ${{ steps.discover.outputs.containers }}
  count:
    description: Number of discovered container targets
    value: ${{ steps.discover.outputs.count }}
  has-containers:
    description: Whether any container targets were discovered
    value: ${{ steps.discover.outputs.has-containers }}

runs:
  steps:
    - name: install dockerfile-tools
      uses: escapace/action-dockerfile-tools@v0.2.1
    - env:
        DOCKERFILE_NAME: ${{ inputs.dockerfile-name }}
        IMAGE_NAME_PREFIX_PREPEND: ${{ inputs.image-name-prefix-prepend }}
        IMAGE_NAME_PREFIX_STRIP: ${{ inputs.image-name-prefix-strip }}
        REQUIRED_PACKAGE_NAME_PREFIX: ${{ inputs.required-package-name-prefix }}
        REQUIRED_SCRIPT_NAME: ${{ inputs.required-script-name }}
        REQUIRED_TARGET: ${{ inputs.required-target }}
      id: discover
      name: discover containers
      uses: actions/github-script@v9
      with:
        script: |
          const { execFileSync } = require('node:child_process')
          const fs = require('node:fs/promises')
          const path = require('node:path')

          function toRepositoryRelativePath(filePath) {
            const relativePath = path.relative(process.env.GITHUB_WORKSPACE, filePath).split(path.sep).join('/')

            return relativePath.length > 0 ? relativePath : '.'
          }

          async function pathExists(filePath) {
            try {
              await fs.access(filePath)
              return true
            } catch (error) {
              if (error && typeof error === 'object' && 'code' in error && error.code === 'ENOENT') {
                return false
              }

              throw error
            }
          }

          async function readPackageJson(directoryPath) {
            const packageJsonPath = path.join(directoryPath, 'package.json')

            try {
              return JSON.parse(await fs.readFile(packageJsonPath, 'utf8'))
            } catch (error) {
              if (error && typeof error === 'object' && 'code' in error && error.code === 'ENOENT') {
                return null
              }

              throw error
            }
          }

          function classifyWorkspaceMemberPatterns(patterns) {
            const exclude = []
            const include = []

            for (const pattern of patterns) {
              if (pattern.startsWith('!')) {
                exclude.push(pattern.slice(1))
              } else {
                include.push(pattern)
              }
            }

            return { exclude, include }
          }

          function resolvePythonExecutable() {
            for (const executable of ['python3', 'python']) {
              try {
                execFileSync(executable, ['--version'], { stdio: 'ignore' })
                return executable
              } catch (error) {
                if (error && typeof error === 'object' && 'code' in error && error.code === 'ENOENT') {
                  continue
                }

                throw error
              }
            }

            throw new Error('Could not find a Python executable. Expected python3 or python on PATH.')
          }

          async function readWorkspaceMemberPatterns(workspace) {
            const absoluteManifestPath = path.join(workspace, 'pnpm-workspace.yaml')

            if (!(await pathExists(absoluteManifestPath))) {
              throw new Error(`Could not find pnpm-workspace.yaml in ${workspace}`)
            }

            const stdout = execFileSync(
              resolvePythonExecutable(),
              [
                '-c',
                [
                  'import json',
                  'import sys',
                  'from pathlib import Path',
                  '',
                  'try:',
                  '    import yaml',
                  'except ModuleNotFoundError as error:',
                  '    raise SystemExit("PyYAML is required to parse pnpm-workspace.yaml") from error',
                  '',
                  'manifest = yaml.safe_load(Path(sys.argv[1]).read_text()) or {}',
                  '',
                  'if not isinstance(manifest, dict):',
                  '    raise SystemExit("Expected pnpm-workspace.yaml to contain a top-level mapping.")',
                  '',
                  'packages = manifest.get("packages", [])',
                  '',
                  'if packages is None:',
                  '    packages = []',
                  '',
                  'if not isinstance(packages, list) or not all(isinstance(item, str) and item for item in packages):',
                  '    raise SystemExit(',
                  '        "Expected pnpm-workspace.yaml packages to be a list of non-empty strings when present."',
                  '    )',
                  '',
                  'print(json.dumps(packages))',
                ].join("\n"),
                absoluteManifestPath,
              ],
              { cwd: workspace, encoding: 'utf8' },
            )
            const patterns = JSON.parse(stdout)

            if (!Array.isArray(patterns)) {
              throw new Error(`Expected parsed workspace package globs from ${absoluteManifestPath}`)
            }

            return classifyWorkspaceMemberPatterns(patterns)
          }

          function inspectDockerfile(absoluteDockerfilePath) {
            const stages = JSON.parse(
              execFileSync('dockerfile-tools', ['list-stages', '--dockerfile', absoluteDockerfilePath], {
                encoding: 'utf8',
              }),
            )

            if (!Array.isArray(stages)) {
              throw new Error(
                `Expected dockerfile-tools list-stages to return a JSON array for ${absoluteDockerfilePath}`,
              )
            }

            return { stages }
          }

          function deriveImageName({ packageDirectory, packageJson }) {
            const packageName = packageJson?.name

            if (typeof packageName !== 'string' || packageName.length === 0) {
              throw new Error(`Expected a package.json name in ${packageDirectory}`)
            }

            return packageName
          }

          function transformImageName({ baseImageName, imageNamePrefixPrepend, imageNamePrefixStrip }) {
            const strippedImageName =
              imageNamePrefixStrip.length > 0 && baseImageName.startsWith(imageNamePrefixStrip)
                ? baseImageName.slice(imageNamePrefixStrip.length)
                : baseImageName
            const imageName = `${imageNamePrefixPrepend}${strippedImageName}`

            if (imageName.length === 0) {
              throw new Error(`Derived an empty container name from ${JSON.stringify(baseImageName)}`)
            }

            return imageName
          }

          function deriveContainerId(name) {
            const id = name.toLowerCase().replace(/[^a-z0-9]+/gu, '-').replace(/^-+|-+$/gu, '')

            if (id.length === 0) {
              throw new Error(`Derived an empty container id from ${JSON.stringify(name)}`)
            }

            return id
          }

          const dockerfileName = process.env.DOCKERFILE_NAME
          const imageNamePrefixPrepend = process.env.IMAGE_NAME_PREFIX_PREPEND
          const imageNamePrefixStrip = process.env.IMAGE_NAME_PREFIX_STRIP
          const requiredPackageNamePrefix = process.env.REQUIRED_PACKAGE_NAME_PREFIX
          const requiredScriptName = process.env.REQUIRED_SCRIPT_NAME
          const requiredTarget = process.env.REQUIRED_TARGET
          const workspace = process.env.GITHUB_WORKSPACE

          if (typeof workspace !== 'string' || workspace.length === 0) {
            throw new Error('Expected GITHUB_WORKSPACE to be set.')
          }

          const memberPatterns = await readWorkspaceMemberPatterns(workspace)
          const candidateDirectories = new Set([workspace])

          if (memberPatterns.include.length > 0) {
            for await (const relativePath of fs.glob(memberPatterns.include, {
              cwd: workspace,
              exclude: ['**/node_modules/**', ...memberPatterns.exclude],
            })) {
              const absolutePath = path.join(workspace, relativePath)
              const stat = await fs.stat(absolutePath)

              if (stat.isDirectory()) {
                candidateDirectories.add(absolutePath)
              }
            }
          }

          const containers = []

          for (const absoluteDirectoryPath of candidateDirectories) {
            const absoluteDockerfilePath = path.join(absoluteDirectoryPath, dockerfileName)

            if (!(await pathExists(absoluteDockerfilePath))) {
              continue
            }

            const packageDirectory = toRepositoryRelativePath(absoluteDirectoryPath)
            const dockerfile = toRepositoryRelativePath(absoluteDockerfilePath)
            const packageJson = await readPackageJson(absoluteDirectoryPath)

            if (packageJson === null) {
              continue
            }

            if (typeof packageJson.name !== 'string' || packageJson.name.length === 0) {
              continue
            }

            if (requiredScriptName.length > 0) {
              const script = packageJson?.scripts?.[requiredScriptName]

              if (typeof script !== 'string') {
                continue
              }
            }

            if (requiredPackageNamePrefix.length > 0 && packageJson.name.startsWith(requiredPackageNamePrefix) === false) {
              continue
            }

            const dockerfileMetadata = inspectDockerfile(absoluteDockerfilePath)

            if (requiredTarget.length > 0 && dockerfileMetadata.stages.includes(requiredTarget) === false) {
              continue
            }

            const baseImageName = deriveImageName({
              packageDirectory,
              packageJson,
            })
            const name = transformImageName({
              baseImageName,
              imageNamePrefixPrepend,
              imageNamePrefixStrip,
            })

            containers.push({
              context: packageDirectory,
              dockerfile,
              id: deriveContainerId(name),
              name,
              'package-directory': packageDirectory,
              'package-name': packageJson.name,
              stages: dockerfileMetadata.stages,
              target: requiredTarget.length > 0 ? requiredTarget : undefined,
            })
          }

          containers.sort(
            (left, right) => left.name.localeCompare(right.name) || left['package-directory'].localeCompare(right['package-directory']),
          )

          const seenIds = new Set()
          const seenNames = new Set()
          for (const container of containers) {
            if (seenNames.has(container.name)) {
              throw new Error(`Discovered duplicate container name: ${container.name}`)
            }
            if (seenIds.has(container.id)) {
              throw new Error(`Discovered duplicate container id: ${container.id}`)
            }
            seenNames.add(container.name)
            seenIds.add(container.id)
          }

          core.setOutput('containers', JSON.stringify(containers))
          core.setOutput('count', String(containers.length))
          core.setOutput('has-containers', containers.length > 0 ? 'true' : 'false')
  using: composite
